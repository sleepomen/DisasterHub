name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # 用 lock 檔安裝：CI 測到的依賴組合要跟映像一致，否則 CI 綠燈不代表容器跑得起來。
      # --only-binary 與 Dockerfile 一致，缺 wheel 要在 CI 就炸出來
      - run: pip install --only-binary :all: -r requirements-dev.lock
      - run: pytest tests/ -v
