# 由 requirements.txt 解析出的完整釘選清單（含所有間接依賴），Dockerfile 實際安裝的是這個檔案。
# requirements.txt 寫的是「意圖」（版本範圍），這裡是「事實」（確切版本）。
#
# 不要手改。要升版就改 requirements.txt 的範圍，然後重新產生：
#
#   docker run --rm -v "$PWD:/src:ro" python:3.12-slim sh -c '#     pip install -q --no-cache-dir --only-binary :all: -r /src/requirements.txt && #     pip freeze --exclude-editable | grep -viE "^(pip|setuptools|wheel|distribute)==" | sort' #     > requirements.lock
#
# 產生環境：python:3.12-slim / linux-amd64。換 Python 版本或平台都要重新產生
# （例如 chroma-hnswlib 沒有 cp313 以上的 wheel，所以目前上限是 3.12）。
