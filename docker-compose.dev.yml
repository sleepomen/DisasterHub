# 開發用疊加設定：熱重載 + 原始碼掛載 + 測試依賴
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  disaster_app:
    build:
      args:
        INSTALL_DEV: "true"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8501", "--reload"]
    volumes:
      - .:/app
      - chroma_data:/data/chroma
