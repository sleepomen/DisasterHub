services:
  disaster_db:
    image: postgis/postgis:15-3.3
    container_name: disaster_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  disaster_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disaster_app
    volumes:
      - .:/app
      - chroma_cache:/root/.cache/chroma
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - disaster_db
      - ollama

  # 【專案改動】選用 profile「mcp」啟動之 MCP 容器；實務上 Cursor 多以宿主 python -m mcp_server
  # stdio 連線。Cursor / MCP 客戶端以 stdio 連線時請在宿主机執行：python -m mcp_server
  # 若在容器內除錯可：docker compose --profile mcp run --rm disaster_mcp
  disaster_mcp:
    profiles:
      - mcp
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disaster_mcp
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    command: ["python", "-m", "mcp_server"]


volumes:
  db_data:
  ollama_data:
  chroma_cache:
