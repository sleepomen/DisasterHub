services:
  disaster_db:
    image: postgis/postgis:15-3.3
    container_name: disaster_db
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  disaster_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disaster_app
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8501", "--reload"]
    volumes:
      - .:/app
      - chroma_cache:/root/.cache/chroma
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ANONYMIZED_TELEMETRY=False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      disaster_db:
        condition: service_healthy

volumes:
  db_data:
  chroma_cache:
